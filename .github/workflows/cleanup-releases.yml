name: cleanup-releases

# Independent release cleanup workflow. Per docs/RELEASE-IDENTITY.md §9.1,
# cleanup uses the protection model: latest/updater-referenced releases are
# always protected; only standard SemVer releases within the same
# product/channel become retention candidates; legacy/unknown objects fail
# closed. Whole-version withdrawal (§9.2) is a separate explicit mode.
#
# This workflow replaces the inline cleanup steps that previously ran inside
# the publish workflows.

on:
  workflow_dispatch:
    inputs:
      mode:
        description: "retention | withdraw"
        required: true
        type: choice
        default: retention
        options:
          - retention
          - withdraw
      product:
        description: "ellamaka-cli | ellamaka-desktop"
        required: true
        type: choice
        options:
          - ellamaka-cli
          - ellamaka-desktop
      keep-stable:
        description: "Number of stable releases to keep (retention mode)"
        required: false
        type: string
        default: "5"
      withdraw-version:
        description: "Version to withdraw (withdraw mode)"
        required: false
        type: string
      fallback-version:
        description: "Healthy fallback version (withdraw mode)"
        required: false
        type: string

jobs:
  cleanup:
    runs-on: ubuntu-latest
    if: github.repository == 'wopal-cn/ellamaka'
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 24
      - name: Run cleanup
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_ENDPOINT: ${{ secrets.R2_ENDPOINT }}
          GH_TOKEN: ${{ secrets.RELEASE_TOKEN }}
          GITEE_TOKEN: ${{ secrets.GITEE_TOKEN }}
        run: |
          if [ "${{ inputs.mode }}" = "retention" ]; then
            if [ "${{ inputs.product }}" = "ellamaka-cli" ]; then
              node scripts/cleanup-ellamaka-releases.mjs --keep "${{ inputs.keep-stable }}" --dry-run
            else
              node scripts/cleanup-desktop-releases.mjs --keep-prod "${{ inputs.keep-stable }}" --dry-run
            fi
          else
            echo "Withdraw mode requires operator review of the plan output before applying."
            echo "Product: ${{ inputs.product }}, Version: ${{ inputs.withdraw-version }}, Fallback: ${{ inputs.fallback-version }}"
            echo "Run the cleanup script manually with --withdraw after reviewing the plan."
          fi
