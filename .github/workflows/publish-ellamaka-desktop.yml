name: publish-ellamaka-desktop

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Override version (optional)"
        required: false
        type: string
      channel:
        description: "Desktop build channel"
        required: false
        default: "prod"
        type: choice
        options:
          - beta
          - prod

# tag-release.sh 触发本 workflow：仅 dispatch，不监听 push:tags。
# 旧设计同时监听 push:tags 与 dispatch，导致 --cli 时 desktop workflow 仍被 push
# 自动触发，虽脚本会在启动后 cancel，但浪费 runner 配额且令用户困惑。
# 现在触发权归 tag-release.sh，按 --cli/--desktop 选择性 dispatch。

# Desktop 创建 wopal-space-ontology GitHub/Gitee Release（与 CLI workflow 一致），
# tag 前缀 ellamaka-desktop-v 以区分 CLI 的 ellamaka-v。
permissions:
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

jobs:
  version:
    runs-on: ubuntu-latest
    if: github.repository == 'wopal-cn/ellamaka'
    outputs:
      version: ${{ steps.version.outputs.version }}
      release: ${{ steps.version.outputs.release }}
      tag: ${{ steps.version.outputs.tag }}
      channel: ${{ steps.version.outputs.channel }}
    steps:
      - name: Derive version
        id: version
        run: |
          if [[ -n "${{ inputs.version }}" ]]; then
            version="${{ inputs.version }}"
            release="true"
            tag="v${version}"
          else
            version="0.0.0-${{ inputs.channel || 'prod' }}.0"
            release=""
            tag=""
          fi

          if [[ "$version" =~ -beta\.[0-9]+$ ]]; then
            inferred_channel="beta"
          else
            inferred_channel="prod"
          fi

          channel="${{ inputs.channel || 'prod' }}"

          if [[ "$channel" == "beta" && ! "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+-beta\.[0-9]+$ ]]; then
            echo "ERROR: beta releases require X.Y.Z-beta.N"
            exit 1
          fi
          if [[ "$channel" == "prod" && "$version" == *-beta.* ]]; then
            echo "ERROR: beta versions require channel=beta"
            exit 1
          fi
          {
            echo "version=${version}"
            echo "release=${release}"
            echo "tag=${tag}"
            echo "channel=${channel}"
          } >> "$GITHUB_OUTPUT"

  build-desktop:
    needs: version
    strategy:
      matrix:
        include:
          # macOS: dmg + zip（arm64 + x64）
          - os: macos-latest
            package_cmd: "package:mac --arm64 --x64"
          # Windows: NSIS（.exe）
          - os: windows-latest
            package_cmd: "package:win"
          # Linux: AppImage + deb + rpm
          - os: ubuntu-latest
            package_cmd: "package:linux"
    runs-on: ${{ matrix.os }}
    if: github.repository == 'wopal-cn/ellamaka'
    env:
      OPENCODE_CHANNEL: ${{ needs.version.outputs.channel }}
      OPENCODE_VERSION: ${{ needs.version.outputs.version }}
      OPENCODE_RELEASE: ${{ needs.version.outputs.release }}
      OPENCODE_BUILD_ID: ${{ github.sha }}
    steps:
      - uses: actions/checkout@v6

      - uses: oven-sh/setup-bun@v2

      - uses: actions/cache@v5
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-${{ hashFiles('bun.lock') }}
          restore-keys: |
            bun-${{ runner.os }}-

      - run: bun install

      - name: Build desktop (electron-vite)
        working-directory: packages/ellamaka-desktop
        run: bun run build

      - name: Package desktop (electron-builder)
        working-directory: packages/ellamaka-desktop
        run: bun run ${{ matrix.package_cmd }} --publish never

      - name: Upload artifacts
        uses: actions/upload-artifact@v7
        with:
          name: desktop-${{ matrix.os }}
          path: |
            packages/ellamaka-desktop/dist/ellamaka-desktop-*
            packages/ellamaka-desktop/dist/latest*.yml
          if-no-files-found: error

  release:
    needs: [version, build-desktop]
    runs-on: ubuntu-latest
    if: github.repository == 'wopal-cn/ellamaka' && needs.version.outputs.release != ''
    env:
      AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
      R2_ENDPOINT: ${{ secrets.R2_ENDPOINT }}
      VERSION: ${{ needs.version.outputs.version }}
      CHANNEL: ${{ needs.version.outputs.channel }}
      BUILD: ${{ github.sha }}
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: "22"

      - name: Download all desktop artifacts
        uses: actions/download-artifact@v8
        with:
          path: dist
          merge-multiple: true

      - name: Generate manifest, checksums, and release notes
        run: |
          if [ "$CHANNEL" = "beta" ]; then
            BASE_URL="https://download.coursedao.com/ellamaka-desktop/beta"
          else
            BASE_URL="https://download.coursedao.com/ellamaka-desktop"
          fi
          node scripts/package-release.mjs manifest \
            --archives-dir dist \
            --version "$VERSION" \
            --output-dir release-output \
            --tag v"$VERSION" \
            --build "$BUILD" \
            --base-url "$BASE_URL"

      - name: Upload binaries and metadata to Cloudflare R2
        run: |
          R2_URL="https://${R2_ENDPOINT}"
          if [ "$CHANNEL" = "beta" ]; then
            R2_ROOT="ellamaka-desktop/beta"
          else
            R2_ROOT="ellamaka-desktop"
          fi
          VERSION_PREFIX="${R2_ROOT}/v${VERSION}"
          LATEST_PREFIX="${R2_ROOT}/latest"
          OLD_OBJECTS="${RUNNER_TEMP}/old-release-objects.json"
          OLD_URLS="${RUNNER_TEMP}/old-release-urls.txt"

          aws s3api list-objects-v2 \
            --bucket wopal-release \
            --prefix "${VERSION_PREFIX}/" \
            --endpoint-url "$R2_URL" \
            --output json > "$OLD_OBJECTS"
          node - "$OLD_OBJECTS" "$OLD_URLS" <<'NODE'
          const fs = require("fs")
          const [input, output] = process.argv.slice(2)
          const data = JSON.parse(fs.readFileSync(input, "utf8"))
          const urls = (data.Contents ?? []).map((entry) => `https://download.coursedao.com/${entry.Key}`)
          fs.writeFileSync(output, urls.join("\n") + (urls.length ? "\n" : ""))
          NODE
          aws s3 rm "s3://wopal-release/${VERSION_PREFIX}/" \
            --recursive \
            --endpoint-url "$R2_URL"

          put_with_cache() {
            local file="$1" key="$2" cache="$3" ct="$4"
            aws s3api delete-object \
              --bucket wopal-release \
              --key "$key" \
              --endpoint-url ${R2_URL} >/dev/null 2>&1 || true
            for attempt in 1 2 3; do
              if aws s3api put-object \
                --bucket wopal-release \
                --key "$key" \
                --body "$file" \
                --content-type "$ct" \
                --cache-control "$cache" \
                --endpoint-url ${R2_URL} >/dev/null; then
                break
              fi
              echo "  put-object attempt $attempt failed for $(basename "$file")"
              if [ "$attempt" -eq 3 ]; then
                echo "ERROR: put-object failed after 3 attempts: $(basename "$file")"
                exit 1
              fi
              sleep 5
            done
          }

          for f in dist/ellamaka-desktop-*; do
            [ -f "$f" ] || continue
            name="$(basename "$f")"
            case "$name" in
              *.dmg|*.zip|*.exe|*.AppImage|*.deb|*.rpm|*.zip.blockmap|*.exe.blockmap) ;;
              *) continue ;;
            esac
            ct="application/octet-stream"
            case "$name" in
              *.dmg) ct="application/x-apple-diskimage" ;;
              *.zip) ct="application/zip" ;;
              *.deb) ct="application/vnd.debian.binary-package" ;;
              *.rpm) ct="application/x-rpm" ;;
            esac
            put_with_cache "$f" "${VERSION_PREFIX}/${name}" "public, max-age=2592000" "$ct"
          done

          put_with_cache "release-output/manifest.json" "${VERSION_PREFIX}/manifest.json" "public, max-age=2592000" "application/json"
          put_with_cache "release-output/checksums.txt" "${VERSION_PREFIX}/checksums.txt" "public, max-age=2592000" "text/plain"
          put_with_cache "release-output/release-notes.md" "${VERSION_PREFIX}/release-notes.md" "public, max-age=2592000" "text/markdown"

          put_with_cache "release-output/manifest.json" "${LATEST_PREFIX}/manifest.json" "public, max-age=60" "application/json"
          echo "  uploaded manifest: ${LATEST_PREFIX}/manifest.json"

          for f in dist/ellamaka-desktop-*; do
            [ -f "$f" ] || continue
            name="$(basename "$f")"
            case "$name" in
              *.zip|*.exe|*.AppImage|*.zip.blockmap|*.exe.blockmap) ;;
              *) continue ;;
            esac
            ct="application/octet-stream"
            case "$name" in
              *.zip) ct="application/zip" ;;
            esac
            put_with_cache "$f" "${LATEST_PREFIX}/${name}" "public, max-age=60" "$ct"
          done

          for feed in latest-mac.yml latest.yml latest-linux.yml; do
            if [ -f "dist/${feed}" ]; then
              put_with_cache "dist/${feed}" "${LATEST_PREFIX}/${feed}" "public, max-age=60" "application/x-yaml"
              echo "  uploaded feed: ${LATEST_PREFIX}/${feed}"
            else
              echo "  WARNING: feed not found, skipping: dist/${feed}"
            fi
          done

          echo "Verifying R2 uploads against manifest..."
          declare -A manifest_sha manifest_size
          while IFS=$'\t' read -r mname msha msize; do
            manifest_sha["$mname"]="$msha"
            manifest_size["$mname"]="$msize"
          done < <(node -e '
            const m = JSON.parse(require("fs").readFileSync("release-output/manifest.json","utf8"));
            for (const a of m.artifacts) console.log([a.name, a.sha256, a.size].join("\t"));
          ')
          for f in dist/ellamaka-desktop-*; do
            [ -f "$f" ] || continue
            name="$(basename "$f")"
            case "$name" in
              *.dmg|*.zip|*.exe|*.AppImage|*.deb|*.rpm) ;;
              *) continue ;;
            esac
            key="${VERSION_PREFIX}/${name}"
            remote_size=$(aws s3api head-object \
              --bucket wopal-release \
              --key "$key" \
              --endpoint-url ${R2_URL} \
              --query 'ContentLength' \
              --output text 2>/dev/null || echo "0")
            expected_size="${manifest_size[$name]}"
            if [ "$remote_size" != "$expected_size" ]; then
              echo "  size mismatch ($name): manifest=$expected_size remote=$remote_size — full hash verify"
              VERIFY_DIR="$(mktemp -d)"
              aws s3api get-object \
                --bucket wopal-release \
                --key "$key" \
                --endpoint-url ${R2_URL} \
                "${VERIFY_DIR}/${name}" >/dev/null
              remote_hash="$(sha256sum "${VERIFY_DIR}/${name}" | cut -d' ' -f1)"
              expected_hash="${manifest_sha[$name]}"
              if [ "$remote_hash" != "$expected_hash" ]; then
                echo "ERROR: R2 checksum mismatch: $name"
                echo "  manifest sha256: $expected_hash"
                echo "  remote   sha256: $remote_hash"
                exit 1
              fi
              rm -rf "$VERIFY_DIR"
              echo "  OK: $name (sha256=$remote_hash size=$remote_size) [full verify]"
            else
              echo "  OK: $name (size=$remote_size) [head-only]"
            fi
          done

          echo "R2 upload complete for ellamaka-desktop v${VERSION}"

      - name: Purge Cloudflare CDN cache
        env:
          CLOUDFLARE_CACHE_PURGE_TOKEN: ${{ secrets.CLOUDFLARE_CACHE_PURGE_TOKEN }}
          CLOUDFLARE_CACHE_PURGE_ZONE: ${{ secrets.CLOUDFLARE_CACHE_PURGE_ZONE }}
        run: |
          if [ -z "${CLOUDFLARE_CACHE_PURGE_TOKEN:-}" ] || [ -z "${CLOUDFLARE_CACHE_PURGE_ZONE:-}" ]; then
            echo "ERROR: CDN purge credentials are required for release publishing."
            exit 1
          fi

          if [ "$CHANNEL" = "beta" ]; then
            CDN_ROOT="https://download.coursedao.com/ellamaka-desktop/beta"
          else
            CDN_ROOT="https://download.coursedao.com/ellamaka-desktop"
          fi
          VERSION_BASE="${CDN_ROOT}/v${VERSION}"
          LATEST_BASE="${CDN_ROOT}/latest"
          PURGE_URLS=(
            "${LATEST_BASE}/manifest.json"
            "${LATEST_BASE}/latest-mac.yml"
            "${LATEST_BASE}/latest.yml"
            "${LATEST_BASE}/latest-linux.yml"
            "${VERSION_BASE}/manifest.json"
            "${VERSION_BASE}/checksums.txt"
            "${VERSION_BASE}/release-notes.md"
          )

          OLD_URLS="${RUNNER_TEMP}/old-release-urls.txt"
          if [ -f "$OLD_URLS" ]; then
            while IFS= read -r url; do
              [ -n "$url" ] && PURGE_URLS+=("$url")
            done < "$OLD_URLS"
          fi

          for f in dist/ellamaka-desktop-*; do
            [ -f "$f" ] || continue
            name="$(basename "$f")"
            case "$name" in
              *.dmg|*.zip|*.exe|*.AppImage|*.deb|*.rpm|*.zip.blockmap|*.exe.blockmap)
                PURGE_URLS+=("${VERSION_BASE}/${name}")
                ;;
            esac
            case "$name" in
              *.zip|*.exe|*.AppImage|*.zip.blockmap|*.exe.blockmap)
                PURGE_URLS+=("${LATEST_BASE}/${name}")
                ;;
            esac
          done

          mapfile -t PURGE_URLS < <(printf '%s\n' "${PURGE_URLS[@]}" | sort -u)
          for ((offset=0; offset<${#PURGE_URLS[@]}; offset+=30)); do
            batch=("${PURGE_URLS[@]:offset:30}")
            payload=$(printf '%s\n' "${batch[@]}" | node -e '
              let input = "";
              process.stdin.on("data", (chunk) => input += chunk);
              process.stdin.on("end", () => {
                const files = input.split(/\r?\n/).filter(Boolean);
                process.stdout.write(JSON.stringify({ files }));
              });
            ')
            response="${RUNNER_TEMP}/purge-response-${offset}.json"
            code=$(curl -sS -o "$response" -w "%{http_code}" \
              -X POST "https://api.cloudflare.com/client/v4/zones/${CLOUDFLARE_CACHE_PURGE_ZONE}/purge_cache" \
              -H "Authorization: Bearer ${CLOUDFLARE_CACHE_PURGE_TOKEN}" \
              -H "Content-Type: application/json" \
              -d "$payload")
            if [ "$code" != "200" ] || ! node -e 'process.exit(JSON.parse(require("fs").readFileSync(process.argv[1], "utf8")).success ? 0 : 1)' "$response"; then
              echo "ERROR: Cloudflare purge failed (HTTP $code)."
              exit 1
            fi
          done
          echo "CDN purge complete for ellamaka-desktop v${VERSION}"

      - name: Create or update ontology GitHub release
        if: needs.version.outputs.release != ''
        env:
          GH_TOKEN: ${{ secrets.RELEASE_TOKEN }}
          VERSION: ${{ needs.version.outputs.version }}
        run: |
          if [ -z "${GH_TOKEN:-}" ]; then
            echo "RELEASE_TOKEN secret is required to publish the ontology GitHub release."
            exit 1
          fi

          version="$VERSION"
          tag="ellamaka-desktop-v${version}"
          if gh release view "$tag" --repo wopal-cn/wopal-space-ontology >/dev/null 2>&1; then
            gh release edit "$tag" \
              --repo wopal-cn/wopal-space-ontology \
              --notes-file release-output/release-notes.md
            echo "Updated ontology release $tag"
          else
            gh release create "$tag" \
              --repo wopal-cn/wopal-space-ontology \
              --title "ellamaka-desktop v${version}" \
              --notes-file release-output/release-notes.md
            echo "Created ontology release $tag"
          fi

      - name: Create or update ontology Gitee release
        if: needs.version.outputs.release != ''
        continue-on-error: true
        env:
          GITEE_TOKEN: ${{ secrets.RELEASE_GITEE }}
          VERSION: ${{ needs.version.outputs.version }}
        run: |
          node scripts/create-gitee-release.mjs \
            --version "$VERSION" \
            --repo wopal-cn/wopal-space-ontology \
            --tag ellamaka-desktop-v"$VERSION" \
            --notes-file release-output/release-notes.md

      - name: Summary
        if: always()
        run: |
          if [ "$CHANNEL" = "beta" ]; then
            CDN_ROOT="https://download.coursedao.com/ellamaka-desktop/beta"
          else
            CDN_ROOT="https://download.coursedao.com/ellamaka-desktop"
          fi
          {
            echo "## Ellamaka Desktop Release Distribution"
            echo ""
            echo "- Channel: ${CHANNEL}"
            echo "- R2 (CDN): ${CDN_ROOT}/v${VERSION}/"
            echo "- Updater feed (latest): ${CDN_ROOT}/latest/"
            echo "- GitHub (ontology): https://github.com/wopal-cn/wopal-space-ontology/releases/tag/ellamaka-desktop-v${VERSION}"
            echo "- Gitee (ontology): https://gitee.com/wopal-cn/wopal-space-ontology/releases/tag/ellamaka-desktop-v${VERSION}"
          } >> $GITHUB_STEP_SUMMARY
