name: Clean up Actions history and caches

on:
  schedule:
    - cron: '0 0 * * *' # Every day at 00:00 UTC (08:00 Beijing time)
  workflow_dispatch: # Allow manual one-click trigger from the GitHub UI

permissions:
  contents: read
  actions: write # Required to delete runs and caches

jobs:
  cleanup:
    name: Run cleanup
    runs-on: ubuntu-latest
    if: github.repository_owner == 'wopal-cn' # Only run on the org's primary repo, not forks

    steps:
      - name: Delete old workflow runs
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          REPO="${{ github.repository }}"
          CUTOFF="$(date -u -d '7 days ago' +%Y-%m-%dT%H:%M:%SZ)"

          # List all runs (newest first) via the official REST API, group by
          # workflow, keep the latest 3 runs per workflow plus everything
          # from the last 7 days, delete the rest.
          gh api --paginate "repos/${REPO}/actions/runs?per_page=100" \
            --jq '.workflow_runs[] | {id, workflow_id, created_at}' \
            | jq -s --arg cutoff "$CUTOFF" '
                group_by(.workflow_id)
                | .[]
                | sort_by(.created_at) | reverse
                | to_entries[]
                | select(.key >= 3)
                | select(.value.created_at < $cutoff)
                | .value.id
              ' \
            | while read -r run_id; do
                echo "Deleting run ${run_id}"
                gh api -X DELETE "repos/${REPO}/actions/runs/${run_id}" || echo "Failed to delete run ${run_id}"
              done

          echo "Run history cleanup done (kept: last 7 days, min 3 runs per workflow)"

      - name: Delete Actions caches
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          REPO="${{ github.repository }}"

          # Delete every cache entry via the official REST API.
          gh api --paginate "repos/${REPO}/actions/caches?per_page=100" \
            --jq '.actions_caches[] | .id' \
            | while read -r cache_id; do
                echo "Deleting cache ${cache_id}"
                gh api -X DELETE "repos/${REPO}/actions/caches/${cache_id}" || echo "Failed to delete cache ${cache_id}"
              done

          echo "Cache cleanup done"

      - name: Generate cleanup report
        if: always()
        run: |
          {
            echo "## Actions cleanup complete"
            echo ""
            echo "Cleanup strategy executed:"
            echo "- **Run history**: keep the last **7 days** of runs, with at least **3 runs** per workflow."
            echo "- **Caches**: deleted all releasable build caches in this repository."
          } >> $GITHUB_STEP_SUMMARY