name: Publish Ellamaka CLI

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Override version (optional)"
        required: false
        type: string
      web_ui:
        description: "Embedded web UI"
        required: false
        default: "ellamaka-app"
        type: choice
        options:
          - ellamaka-app
          - app
          - none

# tag-release.sh 触发本 workflow：仅 dispatch，不监听 push:tags。
# 现在触发权归 tag-release.sh，按 --cli/--desktop 选择性 dispatch。
# Per docs/RELEASE-IDENTITY.md §8-§9, releases are immutable: versioned R2
# paths are never cleared, committed releases are never overwritten.

permissions:
  contents: write

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

jobs:
  version:
    runs-on: ubuntu-latest
    if: github.repository == 'wopal-cn/ellamaka'
    outputs:
      version: ${{ steps.version.outputs.version }}
      release: ${{ steps.version.outputs.release }}
      tag: ${{ steps.version.outputs.tag }}
    steps:
      - name: Derive version
        id: version
        run: |
          if [[ -n "${{ inputs.version }}" ]]; then
            version="${{ inputs.version }}"
            release="true"
            tag="v${version}"
          else
            version="0.0.0-dev"
            release=""
            tag=""
          fi
          {
            echo "version=${version}"
            echo "release=${release}"
            echo "tag=${tag}"
          } >> "$GITHUB_OUTPUT"

  build-and-release:
    needs: version
    runs-on: ubuntu-latest
    if: github.repository == 'wopal-cn/ellamaka'
    steps:
      - uses: actions/checkout@v6

      - uses: oven-sh/setup-bun@v2

      - uses: actions/cache@v5
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-${{ hashFiles('bun.lock') }}
          restore-keys: |
            bun-${{ runner.os }}-

      - run: bun install

      - name: Generate release context
        if: needs.version.outputs.release != ''
        run: |
          # Per docs/RELEASE-IDENTITY.md §9, the release context is assembled
          # from the namespaced tag (GITHUB_REF_NAME) + upstream lock + the
          # checked-out commit (github.sha) + github.run_id. It is the single
          # source of truth for build, manifest, and embedded identity.
          node -e '
            const fs = require("fs");
            const { execSync } = require("child_process");
            const tag = process.env.GITHUB_REF_NAME;
            const lock = JSON.parse(fs.readFileSync("release/upstreams.lock.json", "utf8"));
            const m = tag.match(/^ellamaka-cli-v(.+)$/);
            if (!m) { console.error("not a namespaced ellamaka-cli tag: " + tag); process.exit(1); }
            const version = m[1];
            const ctx = {
              schemaVersion: 2,
              kind: "release",
              product: "ellamaka-cli",
              version,
              channel: "stable",
              upstream: { name: "opencode", version: lock.sources.opencode.version, gitCommit: lock.sources.opencode.gitCommit },
              build: {
                sourceTag: tag,
                gitCommit: process.env.GITHUB_SHA,
                builtAt: new Date().toISOString().replace(/\.\d{3}Z$/, "Z"),
                workflowRunId: process.env.GITHUB_RUN_ID,
              },
            };
            fs.writeFileSync("release-context.json", JSON.stringify(ctx, null, 2) + "\n");
            console.log("Generated release-context.json for " + tag);
          '

      - name: Build
        run: |
          echo "Embedding web UI: ${WEB_UI}"
          bash scripts/build.sh cli --arch primary --web-ui "${WEB_UI}"
        env:
          WEB_UI: ${{ github.event.inputs.web_ui || 'ellamaka-app' }}
          OPENCODE_VERSION: ${{ needs.version.outputs.version }}
          OPENCODE_RELEASE: ${{ needs.version.outputs.release }}
          ELLAMAKA_RELEASE_CONTEXT_PATH: ${{ github.workspace }}/release-context.json

      - name: Create archives
        run: |
          for name in ellamaka-darwin-arm64 ellamaka-darwin-x64 ellamaka-darwin-x64-baseline ellamaka-linux-x64 ellamaka-linux-x64-baseline ellamaka-windows-x64 ellamaka-windows-x64-baseline; do
            test -d "dist/${name}/bin" || { echo "MISSING: dist/${name}/bin"; exit 1; }
            cp LICENSE "dist/${name}/bin/LICENSE"
            if [[ "$name" == *"windows"* ]]; then
              (cd "dist/${name}/bin" && zip -r "../../${name}.zip" .)
            else
              tar -czf "dist/${name}.tar.gz" -C "dist/${name}/bin" .
            fi
          done

      - name: Verify archives
        if: needs.version.outputs.release != ''
        run: |
          for f in dist/ellamaka-darwin-arm64.tar.gz dist/ellamaka-darwin-x64.tar.gz dist/ellamaka-darwin-x64-baseline.tar.gz dist/ellamaka-linux-x64.tar.gz dist/ellamaka-linux-x64-baseline.tar.gz dist/ellamaka-windows-x64.zip dist/ellamaka-windows-x64-baseline.zip; do
            test -f "$f" || { echo "MISSING: $f"; exit 1; }
          done

      - name: Generate schema v2 manifest from release context
        if: needs.version.outputs.release != ''
        run: |
          node scripts/package-release.mjs manifest \
            --archives-dir dist \
            --output-dir release-output \
            --release-context-path release-context.json \
            --engine-api "1.2.0"

      - name: Upload binaries and metadata to Cloudflare R2
        if: needs.version.outputs.release != ''
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_ENDPOINT: ${{ secrets.R2_ENDPOINT }}
          VERSION: ${{ needs.version.outputs.version }}
        run: |
          R2_URL="https://${R2_ENDPOINT}"
          VERSION_PREFIX="ellamaka/v${VERSION}"

          # Per docs/RELEASE-IDENTITY.md §9: versioned R2 paths are immutable.
          # If an effective manifest already exists at the target path, fail
          # closed — do not clear, overwrite, or proceed.
          EXISTING_MANIFEST=$(aws s3api head-object \
            --bucket wopal-release \
            --key "${VERSION_PREFIX}/manifest.json" \
            --endpoint-url "$R2_URL" 2>/dev/null || echo "")
          if [ -n "$EXISTING_MANIFEST" ]; then
            echo "ERROR: effective manifest already exists at ${VERSION_PREFIX}/manifest.json"
            echo "Committed releases are immutable. Use a higher version, or whole-version withdrawal."
            exit 1
          fi
          echo "No existing manifest at ${VERSION_PREFIX} — proceeding (new release or retry after failed-attempt cleanup)."

          # Cache-Control: versioned paths immutable (30 day), latest alias
          # short TTL (60 second). CDN purge on release ensures latest is fresh.
          put_with_cache() {
            local file="$1" key="$2" cache="$3" ct="$4"
            for attempt in 1 2 3; do
              if aws s3api put-object \
                --bucket wopal-release \
                --key "$key" \
                --body "$file" \
                --content-type "$ct" \
                --cache-control "$cache" \
                --endpoint-url ${R2_URL} >/dev/null; then
                break
              fi
              echo "  put-object attempt $attempt failed for $(basename "$file")"
              if [ "$attempt" -eq 3 ]; then
                echo "ERROR: put-object failed after 3 attempts: $(basename "$file")"
                exit 1
              fi
              sleep 5
            done
          }

          # Binary archives (immutable, 30-day cache)
          for f in dist/ellamaka-*.tar.gz dist/ellamaka-*.zip; do
            name="$(basename "$f")"
            ct="application/octet-stream"
            case "$name" in *.tar.gz) ct="application/x-tar";; *.zip) ct="application/zip";; esac
            put_with_cache "$f" "${VERSION_PREFIX}/${name}" "public, max-age=2592000, immutable" "$ct"
          done

          # Metadata (30-day cache with immutable) — manifest is written LAST
          # as the release commit point per §9 manifest-last protocol.
          put_with_cache "release-output/checksums.txt" "${VERSION_PREFIX}/checksums.txt" "public, max-age=2592000, immutable" "text/plain"
          put_with_cache "release-output/release-notes.md" "${VERSION_PREFIX}/release-notes.md" "public, max-age=2592000, immutable" "text/markdown"
          put_with_cache "release-output/manifest.json" "${VERSION_PREFIX}/manifest.json" "public, max-age=2592000, immutable" "application/json"

          # Latest alias: manifest only (60-second TTL).
          # CLI publishes stable only (rc mechanism removed); every release
          # updates the stable alias.
          put_with_cache "release-output/manifest.json" "ellamaka/latest/manifest.json" "public, max-age=60" "application/json"

          # Verify: head-object for size first (fast), full download only if
          # size mismatches. R2 single PUT can silently truncate; size check
          # catches truncation without re-downloading ~200MB of archives.
          echo "Verifying R2 uploads against manifest..."
          declare -A manifest_sha manifest_size
          while IFS=$'\t' read -r mname msha msize; do
            manifest_sha["$mname"]="$msha"
            manifest_size["$mname"]="$msize"
          done < <(node -e '
            const m = JSON.parse(require("fs").readFileSync("release-output/manifest.json","utf8"));
            for (const a of m.artifacts) console.log([a.name, a.sha256, a.size].join("\t"));
          ')
          for f in dist/ellamaka-*.tar.gz dist/ellamaka-*.zip; do
            name="$(basename "$f")"
            key="${VERSION_PREFIX}/${name}"
            remote_size=$(aws s3api head-object \
              --bucket wopal-release \
              --key "$key" \
              --endpoint-url ${R2_URL} \
              --query 'ContentLength' \
              --output text 2>/dev/null || echo "0")
            expected_size="${manifest_size[$name]}"
            if [ "$remote_size" != "$expected_size" ]; then
              echo "  size mismatch ($name): manifest=$expected_size remote=$remote_size — full hash verify"
              VERIFY_DIR="$(mktemp -d)"
              aws s3api get-object \
                --bucket wopal-release \
                --key "$key" \
                --endpoint-url ${R2_URL} \
                "${VERIFY_DIR}/${name}" >/dev/null
              remote_hash="$(sha256sum "${VERIFY_DIR}/${name}" | cut -d' ' -f1)"
              expected_hash="${manifest_sha[$name]}"
              if [ "$remote_hash" != "$expected_hash" ]; then
                echo "ERROR: R2 checksum mismatch: $name"
                echo "  manifest sha256: $expected_hash"
                echo "  remote   sha256: $remote_hash"
                exit 1
              fi
              rm -rf "$VERIFY_DIR"
              echo "  OK: $name (sha256=$remote_hash size=$remote_size) [full verify]"
            else
              echo "  OK: $name (size=$remote_size) [head-only]"
            fi
          done

          echo "R2 upload complete for ellamaka v${VERSION}"

      - name: Purge Cloudflare CDN cache
        if: needs.version.outputs.release != ''
        env:
          CLOUDFLARE_CACHE_PURGE_TOKEN: ${{ secrets.CLOUDFLARE_CACHE_PURGE_TOKEN }}
          CLOUDFLARE_CACHE_PURGE_ZONE: ${{ secrets.CLOUDFLARE_CACHE_PURGE_ZONE }}
          VERSION: ${{ needs.version.outputs.version }}
        run: |
          if [ -z "${CLOUDFLARE_CACHE_PURGE_TOKEN:-}" ] || [ -z "${CLOUDFLARE_CACHE_PURGE_ZONE:-}" ]; then
            echo "ERROR: CDN purge credentials are required for release publishing."
            exit 1
          fi

          # Build purge URL list: latest alias + versioned metadata.
          PURGE_URLS=(
            "https://download.coursedao.com/ellamaka/latest/manifest.json"
            "https://download.coursedao.com/ellamaka/v${VERSION}/manifest.json"
            "https://download.coursedao.com/ellamaka/v${VERSION}/checksums.txt"
            "https://download.coursedao.com/ellamaka/v${VERSION}/release-notes.md"
          )

          mapfile -t PURGE_URLS < <(printf '%s\n' "${PURGE_URLS[@]}" | sort -u)
          for ((offset=0; offset<${#PURGE_URLS[@]}; offset+=30)); do
            batch=("${PURGE_URLS[@]:offset:30}")
            payload=$(printf '%s\n' "${batch[@]}" | node -e '
              let input = "";
              process.stdin.on("data", (chunk) => input += chunk);
              process.stdin.on("end", () => {
                const files = input.split(/\r?\n/).filter(Boolean);
                process.stdout.write(JSON.stringify({ files }));
              });
            ')
            response="${RUNNER_TEMP}/cli-purge-response-${offset}.json"
            code=$(curl -sS -o "$response" -w "%{http_code}" \
              -X POST "https://api.cloudflare.com/client/v4/zones/${CLOUDFLARE_CACHE_PURGE_ZONE}/purge_cache" \
              -H "Authorization: Bearer ${CLOUDFLARE_CACHE_PURGE_TOKEN}" \
              -H "Content-Type: application/json" \
              -d "$payload")
            if [ "$code" != "200" ] || ! node -e 'process.exit(JSON.parse(require("fs").readFileSync(process.argv[1], "utf8")).success ? 0 : 1)' "$response"; then
              echo "ERROR: Cloudflare purge failed (HTTP $code)."
              exit 1
            fi
          done
          echo "CDN purge complete for ellamaka v${VERSION}"

      - name: Warmup Cloudflare CDN cache for release artifacts
        if: needs.version.outputs.release != ''
        continue-on-error: true
        env:
          VERSION: ${{ needs.version.outputs.version }}
        run: |
          echo "Warming up CDN cache for ellamaka v${VERSION}..."
          WARMUP_URLS=(
            "https://download.coursedao.com/ellamaka/latest/manifest.json"
            "https://download.coursedao.com/ellamaka/v${VERSION}/manifest.json"
          )
          while IFS= read -r url; do
            [ -n "$url" ] && WARMUP_URLS+=("$url")
          done < <(node -e '
            const m = JSON.parse(require("fs").readFileSync("release-output/manifest.json","utf8"));
            for (const a of m.artifacts) console.log(a.url);
          ')

          for url in "${WARMUP_URLS[@]}"; do
            echo "Pre-fetching: $url"
            curl -s -L -X GET -H "User-Agent: WopalReleaseWarmup/1.0" --range 0-1048576 -o /dev/null "$url" || true
          done
          echo "CDN cache warmup complete."

      - name: Create ellamaka GitHub release (idempotent create, no overwrite)
        if: needs.version.outputs.release != ''
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.version.outputs.version }}
        run: |
          version="$VERSION"
          tag="ellamaka-cli-v${version}"
          if gh release view "$tag" --repo wopal-cn/ellamaka >/dev/null 2>&1; then
            echo "Release $tag already exists — committed releases are immutable, skipping (no edit/overwrite)."
          else
            gh release create "$tag" \
              --repo wopal-cn/ellamaka \
              --title "ellamaka-cli v${version}" \
              --notes-file release-output/release-notes.md
            echo "Created ellamaka release $tag"
          fi

      - name: Create ontology GitHub release (idempotent create)
        if: needs.version.outputs.release != ''
        env:
          GH_TOKEN: ${{ secrets.RELEASE_TOKEN }}
          VERSION: ${{ needs.version.outputs.version }}
        run: |
          if [ -z "${GH_TOKEN:-}" ]; then
            echo "RELEASE_TOKEN secret is required to publish the ontology GitHub release."
            exit 1
          fi

          version="$VERSION"
          tag="ellamaka-cli-v${version}"
          if gh release view "$tag" --repo wopal-cn/wopal-space-ontology >/dev/null 2>&1; then
            echo "Release $tag already exists — committed releases are immutable, skipping."
          else
            gh release create "$tag" \
              --repo wopal-cn/wopal-space-ontology \
              --title "ellamaka-cli v${version}" \
              --notes-file release-output/release-notes.md
            echo "Created ontology release $tag"
          fi

      - name: Create ellamaka Gitee release (idempotent create)
        if: needs.version.outputs.release != ''
        continue-on-error: true
        env:
          GITEE_TOKEN: ${{ secrets.RELEASE_GITEE }}
          VERSION: ${{ needs.version.outputs.version }}
        run: |
          node scripts/create-gitee-release.mjs \
            --version "$VERSION" \
            --repo wopal-cn/ellamaka \
            --tag ellamaka-cli-v"$VERSION" \
            --product-name "ellamaka-cli" \
            --notes-file release-output/release-notes.md

      - name: Create ontology Gitee release (idempotent create)
        if: needs.version.outputs.release != ''
        continue-on-error: true
        env:
          GITEE_TOKEN: ${{ secrets.RELEASE_GITEE }}
          VERSION: ${{ needs.version.outputs.version }}
        run: |
          node scripts/create-gitee-release.mjs \
            --version "$VERSION" \
            --repo wopal-cn/wopal-space-ontology \
            --tag ellamaka-cli-v"$VERSION" \
            --product-name "ellamaka-cli" \
            --notes-file release-output/release-notes.md

      - name: Summary
        if: always()
        env:
          VERSION: ${{ needs.version.outputs.version }}
        run: |
          {
            echo "## Ellamaka Release Distribution"
            echo ""
            echo "- R2 (CDN): https://download.coursedao.com/ellamaka/v${VERSION}/"
            echo "- GitHub (ellamaka): https://github.com/wopal-cn/ellamaka/releases/tag/ellamaka-cli-v${VERSION}"
            echo "- GitHub (ontology): https://github.com/wopal-cn/wopal-space-ontology/releases/tag/ellamaka-cli-v${VERSION}"
            echo "- Gitee (ellamaka): https://gitee.com/wopal-cn/ellamaka/releases/tag/ellamaka-cli-v${VERSION}"
            echo "- Gitee (ontology): https://gitee.com/wopal-cn/wopal-space-ontology/releases/tag/ellamaka-cli-v${VERSION}"
          } >> $GITHUB_STEP_SUMMARY
