name: publish-ellamaka

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Override version (optional)"
        required: false
        type: string
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  version:
    runs-on: ubuntu-latest
    if: github.repository == 'wopal-cn/ellamaka'
    outputs:
      version: ${{ steps.version.outputs.version }}
      release: ${{ steps.version.outputs.release }}
      tag: ${{ steps.version.outputs.tag }}
    steps:
      - name: Derive version
        id: version
        run: |
          if [[ "${{ github.event_name }}" == "push" ]]; then
            version="${GITHUB_REF_NAME#v}"
            release="true"
            tag="${GITHUB_REF_NAME}"
          elif [[ -n "${{ inputs.version }}" ]]; then
            version="${{ inputs.version }}"
            release="true"
            tag="v${version}"
          else
            version="0.0.0-dev"
            release=""
            tag=""
          fi
          {
            echo "version=${version}"
            echo "release=${release}"
            echo "tag=${tag}"
          } >> "$GITHUB_OUTPUT"

  build-and-release:
    needs: version
    runs-on: ubuntu-latest
    if: github.repository == 'wopal-cn/ellamaka'
    steps:
      - uses: actions/checkout@v5

      - uses: oven-sh/setup-bun@v2

      - uses: actions/cache@v4
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-${{ hashFiles('bun.lock') }}
          restore-keys: |
            bun-${{ runner.os }}-

      - run: bun install

      - name: Build
        run: bun packages/ellamaka/build.ts --arch primary
        env:
          OPENCODE_VERSION: ${{ needs.version.outputs.version }}
          OPENCODE_RELEASE: ${{ needs.version.outputs.release }}

      - name: Create archives
        run: |
          for name in ellamaka-darwin-arm64 ellamaka-darwin-x64 ellamaka-darwin-x64-baseline ellamaka-linux-x64 ellamaka-linux-x64-baseline ellamaka-windows-x64 ellamaka-windows-x64-baseline; do
            test -d "dist/${name}/bin" || { echo "MISSING: dist/${name}/bin"; exit 1; }
            cp LICENSE "dist/${name}/bin/LICENSE"
            if [[ "$name" == *"windows"* ]]; then
              (cd "dist/${name}/bin" && zip -r "../../${name}.zip" .)
            else
              tar -czf "dist/${name}.tar.gz" -C "dist/${name}/bin" .
            fi
          done

      - name: Verify archives
        if: needs.version.outputs.release != ''
        run: |
          for f in dist/ellamaka-darwin-arm64.tar.gz dist/ellamaka-darwin-x64.tar.gz dist/ellamaka-darwin-x64-baseline.tar.gz dist/ellamaka-linux-x64.tar.gz dist/ellamaka-linux-x64-baseline.tar.gz dist/ellamaka-windows-x64.zip dist/ellamaka-windows-x64-baseline.zip; do
            test -f "$f" || { echo "MISSING: $f"; exit 1; }
          done

      - name: Generate manifest, checksums, and release notes
        if: needs.version.outputs.release != ''
        env:
          VERSION: ${{ needs.version.outputs.version }}
        run: |
          node scripts/package-release.mjs manifest \
            --archives-dir dist \
            --version "$VERSION" \
            --output-dir release-output \
            --tag v"$VERSION"

      - name: Upload binaries and metadata to Cloudflare R2
        if: needs.version.outputs.release != ''
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_ENDPOINT: ${{ secrets.R2_ENDPOINT }}
          VERSION: ${{ needs.version.outputs.version }}
        run: |
          R2_URL="https://${R2_ENDPOINT}"
          VERSION_KEY="s3://wopal-release/ellamaka/v${VERSION}"
          LATEST_KEY="s3://wopal-release/ellamaka/latest"

          # Use s3api put-object (single PUT) instead of s3 cp (multipart).
          # R2's multipart upload can silently corrupt objects: the stored
          # bytes diverge from the uploaded data, while content-length
          # metadata still reflects the original size. Single PUT avoids
          # multipart entirely — S3 supports up to 5GB per single PUT.
          for f in dist/ellamaka-*.tar.gz dist/ellamaka-*.zip; do
            name="$(basename "$f")"
            content_type="application/octet-stream"
            case "$name" in *.tar.gz) content_type="application/x-tar";; *.zip) content_type="application/zip";; esac
            aws s3api put-object \
              --bucket wopal-release \
              --key "ellamaka/v${VERSION}/${name}" \
              --body "$f" \
              --content-type "$content_type" \
              --endpoint-url ${R2_URL} >/dev/null
          done

          aws s3api put-object \
            --bucket wopal-release \
            --key "ellamaka/v${VERSION}/manifest.json" \
            --body release-output/manifest.json \
            --content-type "application/json" \
            --endpoint-url ${R2_URL} >/dev/null

          aws s3api put-object \
            --bucket wopal-release \
            --key "ellamaka/v${VERSION}/checksums.txt" \
            --body release-output/checksums.txt \
            --content-type "text/plain" \
            --endpoint-url ${R2_URL} >/dev/null

          aws s3api put-object \
            --bucket wopal-release \
            --key "ellamaka/v${VERSION}/release-notes.md" \
            --body release-output/release-notes.md \
            --content-type "text/markdown" \
            --endpoint-url ${R2_URL} >/dev/null

          aws s3api put-object \
            --bucket wopal-release \
            --key "ellamaka/latest/manifest.json" \
            --body release-output/manifest.json \
            --content-type "application/json" \
            --endpoint-url ${R2_URL} >/dev/null

          # Download back from CDN and verify sha256 matches manifest.
          # This catches any storage-layer corruption (multipart, encoding,
          # CDN transform) before the release is announced.
          echo "Verifying uploaded artifacts..."
          for f in dist/ellamaka-*.tar.gz dist/ellamaka-*.zip; do
            name="$(basename "$f")"
            local_hash="$(sha256sum "$f" | cut -d' ' -f1)"
            remote_hash="$(curl -fsSL "https://download.coursedao.com/ellamaka/v${VERSION}/${name}" | sha256sum | cut -d' ' -f1)"
            if [ "$local_hash" != "$remote_hash" ]; then
              echo "ERROR: checksum mismatch after upload: $name"
              echo "  local  sha256: $local_hash"
              echo "  remote sha256: $remote_hash"
              echo "  The object may be corrupted in R2. Re-run the workflow to retry."
              exit 1
            fi
            echo "  OK: $name"
          done

          echo "R2 upload complete for ellamaka v${VERSION}"

      - name: Create or update ellamaka GitHub release (no binary assets)
        if: needs.version.outputs.release != ''
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.version.outputs.version }}
        run: |
          version="$VERSION"
          tag="v${version}"
          if gh release view "$tag" --repo wopal-cn/ellamaka >/dev/null 2>&1; then
            gh release edit "$tag" \
              --repo wopal-cn/ellamaka \
              --draft=false \
              --notes-file release-output/release-notes.md
            echo "Updated ellamaka release $tag"
          else
            gh release create "$tag" \
              --repo wopal-cn/ellamaka \
              --title "ellamaka v${version}" \
              --notes-file release-output/release-notes.md
            echo "Created ellamaka release $tag"
          fi

      - name: Create or update ontology GitHub release (no binary assets)
        if: needs.version.outputs.release != ''
        env:
          GH_TOKEN: ${{ secrets.RELEASE_TOKEN }}
          VERSION: ${{ needs.version.outputs.version }}
        run: |
          if [ -z "${GH_TOKEN:-}" ]; then
            echo "RELEASE_TOKEN secret is required to publish the ontology GitHub release."
            exit 1
          fi

          version="$VERSION"
          tag="ellamaka-v${version}"
          if gh release view "$tag" --repo wopal-cn/wopal-space-ontology >/dev/null 2>&1; then
            gh release edit "$tag" \
              --repo wopal-cn/wopal-space-ontology \
              --notes-file release-output/release-notes.md
            echo "Updated ontology release $tag"
          else
            gh release create "$tag" \
              --repo wopal-cn/wopal-space-ontology \
              --title "ellamaka v${version}" \
              --notes-file release-output/release-notes.md
            echo "Created ontology release $tag"
          fi

      - name: Create or update ellamaka Gitee release (no binary assets)
        if: needs.version.outputs.release != ''
        continue-on-error: true
        env:
          GITEE_TOKEN: ${{ secrets.RELEASE_GITEE }}
          VERSION: ${{ needs.version.outputs.version }}
        run: |
          node scripts/create-gitee-release.mjs \
            --version "$VERSION" \
            --repo wopal-cn/ellamaka \
            --tag v"$VERSION" \
            --notes-file release-output/release-notes.md

      - name: Create or update ontology Gitee release (no binary assets)
        if: needs.version.outputs.release != ''
        continue-on-error: true
        env:
          GITEE_TOKEN: ${{ secrets.RELEASE_GITEE }}
          VERSION: ${{ needs.version.outputs.version }}
        run: |
          node scripts/create-gitee-release.mjs \
            --version "$VERSION" \
            --repo wopal-cn/wopal-space-ontology \
            --tag ellamaka-v"$VERSION" \
            --notes-file release-output/release-notes.md

      - name: Summary
        if: always()
        env:
          VERSION: ${{ needs.version.outputs.version }}
        run: |
          {
            echo "## Ellamaka Release Distribution"
            echo ""
            echo "- R2 (CDN): https://download.coursedao.com/ellamaka/v${VERSION}/"
            echo "- GitHub (ellamaka): https://github.com/wopal-cn/ellamaka/releases/tag/v${VERSION}"
            echo "- GitHub (ontology): https://github.com/wopal-cn/wopal-space-ontology/releases/tag/ellamaka-v${VERSION}"
            echo "- Gitee (ellamaka): https://gitee.com/wopal-cn/ellamaka/releases/tag/v${VERSION}"
            echo "- Gitee (ontology): https://gitee.com/wopal-cn/wopal-space-ontology/releases/tag/ellamaka-v${VERSION}"
          } >> $GITHUB_STEP_SUMMARY
