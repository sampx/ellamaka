<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="theme-color" content="#0a0c10" />
  <title>Ellamaka Chat</title>
  <script src="https://cdn.jsdelivr.net/npm/marked@12.0.2/marked.min.js"></script>
  <style>
    :root {
      --bg: #0a0c10; --surface: #13161c; --surface-2: #1c2128;
      --border: #1f2530; --border-2: #2a3242;
      --text: #e4e7ec; --muted: #6b7280; --blue: #3b82f6;
      --safe-bottom: env(safe-area-inset-bottom, 0px);
    }
    * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
    html, body { height: 100dvh; }
    body {
      margin: 0; background: var(--bg); color: var(--text);
      font: 15px/1.5 -apple-system, BlinkMacSystemFont, "PingFang SC", "Segoe UI", system-ui, sans-serif;
      display: flex; flex-direction: column; overflow: hidden; touch-action: manipulation;
    }

    #header {
      flex-shrink: 0; min-height: calc(48px + env(safe-area-inset-top, 0px));
      padding: env(safe-area-inset-top, 0px) 8px 8px;
      background: var(--surface); border-bottom: 1px solid var(--border);
      display: flex; align-items: center; gap: 10px;
    }
    #header .back { color: var(--blue); text-decoration: none; font-size: 22px; padding: 2px 8px; line-height: 1; }
    #header h1 { flex: 1; margin: 0; font-size: 16px; font-weight: 600; min-width: 0; }
    #header .dot { width: 8px; height: 8px; border-radius: 50%; background: #4b5563; flex-shrink: 0; }
    #header .dot.on { background: #22c55e; }

    #messages {
      flex: 1; min-height: 0; overflow-y: auto; -webkit-overflow-scrolling: touch;
      padding: 14px 12px; display: flex; flex-direction: column; gap: 12px;
    }
    .row { display: flex; gap: 8px; align-items: flex-start; }
    .row.user { flex-direction: row-reverse; }
    .avatar {
      flex-shrink: 0; width: 30px; height: 30px; border-radius: 50%;
      display: flex; align-items: center; justify-content: center; font-size: 13px; margin-top: 2px;
    }
    .avatar.ai { background: var(--surface-2); color: var(--muted); }
    .avatar.user { background: var(--blue); color: #fff; }
    .bubble {
      max-width: 78%; border-radius: 14px; padding: 9px 13px;
      word-wrap: break-word; word-break: break-word;
    }
    .bubble.ai { background: var(--surface); border: 1px solid var(--border); color: var(--text); }
    .bubble.user { background: var(--blue); color: #fff; }
    .bubble.ai p { margin: 0 0 8px; }
    .bubble.ai p:last-child { margin-bottom: 0; }
    .bubble.ai ul, .bubble.ai ol { margin: 4px 0 8px; padding-left: 20px; }
    .bubble.ai code {
      background: rgba(255,255,255,.08); padding: 1px 5px; border-radius: 4px;
      font: 13px/1.4 ui-monospace, SFMono-Regular, Menlo, monospace;
    }
    .bubble.ai pre {
      background: #050709; color: #c9d1d9; padding: 10px 12px; border-radius: 8px;
      overflow-x: auto; margin: 6px 0; border: 1px solid var(--border);
    }
    .bubble.ai pre code { background: none; padding: 0; color: inherit; }
    .status-row { display: flex; gap: 8px; align-items: center; }
    .status-bubble {
      background: var(--surface); border: 1px solid var(--border); border-radius: 14px;
      padding: 9px 13px; color: var(--muted); font-style: italic; font-size: 14px;
    }
    .empty-hint { text-align: center; color: var(--muted); font-size: 14px; padding: 60px 20px; }

    #input-bar {
      flex-shrink: 0; background: var(--surface); border-top: 1px solid var(--border);
      padding: 8px 10px calc(8px + var(--safe-bottom)); display: flex; gap: 8px; align-items: flex-end;
    }
    #input {
      flex: 1; resize: none; border: 1px solid var(--border-2); border-radius: 18px;
      padding: 9px 14px; font: inherit; font-size: 16px;
      max-height: 120px; min-height: 38px; line-height: 1.4;
      background: var(--bg); color: var(--text); outline: none;
      transition: border-color .15s;
    }
    #input:focus { border-color: var(--blue); }
    #input::placeholder { color: #4b5563; }
    #send {
      flex-shrink: 0; width: 38px; height: 38px; border-radius: 50%;
      border: 0; background: var(--blue); color: #fff;
      display: flex; align-items: center; justify-content: center;
    }
    #send:disabled { opacity: .4; }
    #send svg { width: 18px; height: 18px; }
  </style>
</head>
<body>

  <div id="header">
    <a class="back" href="/" title="返回首页">‹</a>
    <h1>Ellamaka Chat</h1>
    <span class="dot" id="dot"></span>
  </div>

  <div id="messages">
    <div class="empty-hint" id="hint">发送消息开始对话</div>
  </div>

  <div id="input-bar">
    <textarea id="input" rows="1" placeholder="输入消息…" enterkeyhint="send" autocomplete="off"></textarea>
    <button id="send" disabled aria-label="发送">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <line x1="22" y1="2" x2="11" y2="13"></line>
        <polygon points="22 2 15 22 11 13 2 9 22 2"></polygon>
      </svg>
    </button>
  </div>

  <script>
    const $messages = document.getElementById("messages");
    const $input = document.getElementById("input");
    const $send = document.getElementById("send");
    const $dot = document.getElementById("dot");

    const messages = new Map();
    let statusText = "";
    marked.setOptions({ breaks: true, gfm: true });

    function escapeHtml(s) { return String(s).replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c])); }
    function scrollToBottom() { requestAnimationFrame(() => { $messages.scrollTop = $messages.scrollHeight; }); }

    function renderMessage(msg) {
      let entry = messages.get(msg.id);
      if (!entry) {
        const row = document.createElement("div");
        row.className = `row ${msg.role}`;
        row.innerHTML = `<div class="avatar ${msg.role}">${msg.role === "user" ? "我" : "AI"}</div><div class="bubble ${msg.role}"></div>`;
        $messages.appendChild(row);
        entry = { ...msg, el: row.querySelector(".bubble"), row };
        messages.set(msg.id, entry);
      }
      entry.el[msg.role === "user" ? "textContent" : "innerHTML"] =
        msg.role === "user" ? msg.text : marked.parse(msg.text || "");
      const hint = document.getElementById("hint");
      if (hint && messages.size > 0) hint.remove();
      scrollToBottom();
    }

    function renderStatus(text) {
      statusText = text;
      let el = document.getElementById("status-row");
      if (!text) { if (el) el.remove(); return; }
      if (!el) {
        el = document.createElement("div");
        el.id = "status-row";
        el.className = "status-row";
        el.innerHTML = `<div class="avatar ai">AI</div><div class="status-bubble"></div>`;
        $messages.appendChild(el);
      }
      el.querySelector(".status-bubble").textContent = text;
      scrollToBottom();
    }

    async function loadSnapshot() {
      try {
        const res = await fetch("/api/chat/messages");
        const data = await res.json();
        if (data.success && data.data?.messages) {
          for (const m of data.data.messages) renderMessage(m);
          renderStatus(data.data.status || "");
        }
      } catch {}
    }

    function connect() {
      const es = new EventSource("/api/chat/stream");
      es.onopen = () => { $dot.classList.add("on"); };
      es.onmessage = (ev) => {
        try {
          const data = JSON.parse(ev.data);
          if (data.type === "snapshot") {
            for (const m of data.messages || []) renderMessage(m);
            renderStatus(data.status || "");
            return;
          }
          if (data.type === "status") return renderStatus(data.status || "");
          if (data.type === "error") return renderStatus(data.message || "session error");
          if (data.type === "message_delta") {
            renderMessage({ id: data.message_id, role: "assistant", text: data.text });
            if (statusText) renderStatus("");
          }
        } catch {}
      };
      es.onerror = () => { $dot.classList.remove("on"); };
    }

    async function sendMessage() {
      const text = $input.value.trim();
      if (!text) return;
      const id = `u-${Date.now()}-${Math.random().toString(36).slice(2, 8)}`;
      renderMessage({ id, role: "user", text });
      $input.value = "";
      autosize();
      updateSendButton();
      try {
        const res = await fetch("/api/chat/send", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ message: text, message_id: id }),
        });
        const data = await res.json().catch(() => ({}));
        if (!res.ok || data.success === false) renderStatus(data.message || "发送失败");
      } catch {}
    }

    function autosize() { $input.style.height = "auto"; $input.style.height = Math.min($input.scrollHeight, 120) + "px"; }
    function updateSendButton() { $send.disabled = !$input.value.trim(); }

    $input.addEventListener("input", () => { autosize(); updateSendButton(); });
    $input.addEventListener("keydown", (e) => {
      if (e.key === "Enter" && !e.shiftKey) { e.preventDefault(); sendMessage(); }
    });
    $send.addEventListener("click", sendMessage);

    (async () => {
      await loadSnapshot();
      connect();
    })();
  </script>
</body>
</html>
